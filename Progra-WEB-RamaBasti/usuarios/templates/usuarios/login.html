{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/Fondo2.css'%}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>Iniciar Sesión</title>

</head>

<body>
  
    <form method="post">
        {% csrf_token %}
        <h1>Iniciar sesión</h1>

        <div class="contenedor">
          <input name="email" type="text" id="email" placeholder="Email o Usuario"> <!-- Añadido el identificador y el evento oninput -->
          <div class="invalid-feedback">Por favor, ingresa un correo electrónico válido.</div> <!-- Mensaje de error para cuando el campo no es un email válido -->
        </div>
      
        <div class="contenedor">
            <input name="contrasena" type="password" placeholder="Contraseña" required>
        </div>

        <div class="recordar">
            <label for="#"><input type="checkbox">Recordar Contraseña</label>
            <a href="contra_olvido.html">Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn1">Iniciar sesión</button>

        <div class="registro-enlaces">
            <p>¿No tienes cuenta? <a href="registro.html"> Crear</a></p>
        </div>

        <div class="contenedor">
          <center><a href="{% url 'index'%}"><button type="button" class="btn2"><i class="bi bi-arrow-left"></i></button></a></center>
      </div>
    </form>
</body>

</html>
